services:
  postgres:
    image: postgres:18-alpine
    profiles: ["dev", "full"]
    container_name: monorepo_postgres
    restart: unless-stopped
    ports:
      # Bind to loopback only — never expose Postgres (default creds) to the LAN
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: monorepo
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: builder
    container_name: monorepo_migrate
    profiles: ["full"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required - set it in .env}
    working_dir: /workspace/apps/api
    entrypoint: ["sh", "-c"]
    command:
      - |
        pnpm exec prisma migrate deploy

  api:
    image: nextjs-nestjs-turborepo-template-api:latest
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: monorepo_api
    restart: unless-stopped
    profiles: ["full"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      # Loopback only — this stack is a local production-shaped test harness,
      # not something to expose on the LAN
      - "127.0.0.1:3001:3001"
    environment:
      NODE_ENV: production
      PORT: 3001
      LOG_LEVEL: info
      CORS_ORIGIN: http://localhost:3000
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required - set it in .env}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET is required - copy .env.example to .env at the repo root}
      BETTER_AUTH_URL: http://localhost:3001
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-onboarding@resend.dev}

  web:
    image: nextjs-nestjs-turborepo-template-web:latest
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:3001
        # The real secret is intentionally NOT passed at build time — build args
        # persist in image metadata (`docker history`). The Dockerfile's dummy
        # default satisfies build-time env validation; the runtime value below
        # is what the proxy actually uses.
    container_name: monorepo_web
    restart: unless-stopped
    profiles: ["full"]
    depends_on:
      - api
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://localhost:3001
      INTERNAL_API_URL: http://api:3001
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET is required - copy .env.example to .env at the repo root}

volumes:
  postgres_data:
