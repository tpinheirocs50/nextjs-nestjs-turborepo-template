# Local development overrides, layered on top of docker-compose.yml by every
# `pnpm db:*` and `pnpm docker:*` script (and by CI, which exercises the same
# local-shaped stack).
#
# Deliberately NOT layered in by `pnpm docker:prod` — production points
# DATABASE_URL at a managed database, and starting a second, unused Postgres
# there would waste resources and invite confusion about which one is real.
#
# Because this file owns the postgres service, it also owns migrate's dependency
# on it: without the overlay, migrate runs as soon as it is started, which is
# exactly what you want when the database lives elsewhere.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:18-alpine
    profiles: ["dev", "full"]
    container_name: monorepo_postgres
    restart: unless-stopped
    logging: *default-logging
    ports:
      # Bind to loopback only — never expose Postgres to the LAN
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-monorepo}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrate:
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
